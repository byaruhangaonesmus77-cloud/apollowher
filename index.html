<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Love Message for Hellen 💕</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      text-align: center;
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      color: #fff;
      margin: 0;
      padding: 40px;
      overflow: hidden;
    }
    h1 {
      font-size: 40px;
      animation: glow 2s infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px #fff; }
      to { text-shadow: 0 0 20px #ff69b4; }
    }
    p {
      font-size: 22px;
      margin-top: 20px;
    }
    /* Slideshow */
    .slideshow {
      margin-top: 30px;
      position: relative;
      width: 300px;
      margin-left: auto;
      margin-right: auto;
    }
    .slideshow img {
      width: 100%;
      height: auto;
      border-radius: 15px;
      display: none;
      position: absolute;
      top: 0;
      left: 0;
    }
    .slideshow img.active {
      display: block;
      animation: fade 2s;
    }
    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    /* Floating hearts */
    .heart {
      position: absolute;
      bottom: -50px;
      font-size: 30px;
      color: red;
      animation: float 6s infinite;
    }
    @keyframes float {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-600px) scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body>
  <h1>💖 To My Lovely Hellen 💖</h1>
  <p>You are my sunshine 🌞, my happiness 😊, and my forever love 💕</p>

  <!-- Background Music -->
  <audio controls autoplay loop>
    <source src="song.mp3.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <!-- Slideshow -->
  <div class="slideshow">
    <img src="hellen1.jpg.jpg" class="active">
    <img src="hellen2.jpg.jpg">
    <img src="hellen3.jpg.jpg">
  </div>

  <!-- Floating Hearts -->
  <div class="heart" style="left:20px;">❤️</div>
  <div class="heart" style="left:100px; animation-delay:2s;">💖</div>
  <div class="heart" style="left:200px; animation-delay:4s;">💕</div>
  <div class="heart" style="left:300px; animation-delay:1s;">💘</div>
  <div class="heart" style="left:400px; animation-delay:3s;">💓</div>

  <script>
    // Slideshow logic
    let slides = document.querySelectorAll('.slideshow img');
    let index = 0;
    setInterval(() => {
      slides[index].classList.remove('active');
      index = (index + 1) % slides.length;
      slides[index].classList.add('active');
    }, 3000);
  </script>
</body>
</html>
